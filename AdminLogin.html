<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台管理系統 - 登入</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft JhengHei', sans-serif; 
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .login-container { 
            background: white; 
            border-radius: 10px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); 
            padding: 50px; 
            width: 100%; 
            max-width: 400px;
        }
        .header { 
            text-align: center; 
            margin-bottom: 40px; 
        }
        .header h1 { 
            color: #2c3e50; 
            font-size: 28px; 
            margin-bottom: 10px; 
        }
        .header p { 
            color: #7f8c8d; 
            font-size: 14px; 
        }
        .badge-admin {
            display: inline-block;
            background: #e74c3c;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }
        .form-group { 
            margin-bottom: 25px; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #2c3e50; 
            font-weight: 600; 
            font-size: 14px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ecf0f1; 
            border-radius: 5px; 
            font-size: 14px; 
            transition: border-color 0.3s;
        }
        input:focus { 
            outline: none; 
            border-color: #e74c3c; 
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.1);
        }
        .btn-login { 
            width: 100%; 
            padding: 12px; 
            background: #e74c3c; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .btn-login:hover { 
            background: #c0392b; 
        }
        .btn-login:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }
        .message { 
            padding: 12px; 
            margin-bottom: 20px; 
            border-radius: 5px; 
            display: none;
            font-size: 14px;
        }
        .message.error { 
            background: #fadbd8; 
            color: #c0392b; 
            border-left: 4px solid #c0392b;
            display: block;
        }
        .message.success { 
            background: #d5f4e6; 
            color: #27ae60; 
            border-left: 4px solid #27ae60;
            display: block;
        }
        .security-info {
            background: #eaf2f8;
            padding: 12px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
        }
        .security-info p {
            margin: 5px 0;
        }
        .loading {
            display: none;
            text-align: center;
        }
        .spinner {
            border: 3px solid #ecf0f1;
            border-top: 3px solid #e74c3c;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1>📊 後台管理系統</h1>
            <p>申請入學審查資料系統</p>
            <div class="badge-admin">🔐 後台登入</div>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="account">後台帳號</label>
                <input 
                    type="text" 
                    id="account" 
                    name="account" 
                    required 
                    placeholder="請輸入帳號"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="password">密碼</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    required 
                    placeholder="請輸入密碼"
                    autocomplete="off"
                >
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>登入中...</p>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">登入系統</button>
        </form>

        <div class="security-info">
            <p>🔒 <strong>安全提示：</strong></p>
            <p>• 請勿在公用電腦上勾選「記住密碼」</p>
            <p>• 使用完畢後請務必登出</p>
            <p>• 如遺忘密碼，請聯絡管理員</p>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const account = document.getElementById('account').value.trim();
            const password = document.getElementById('password').value;

            if (!account || !password) {
                showMessage('帳號和密碼不能為空', 'error');
                return;
            }

            // 顯示載入中
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loginBtn').disabled = true;

            try {
                const result = await google.script.run
                    .withSuccessHandler(handleLoginResponse)
                    .withFailureHandler(handleLoginError)
                    .adminLogin(account, password);

            } catch (error) {
                showMessage('系統錯誤，請稍後再試', 'error');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginBtn').disabled = false;
            }
        });

        function handleLoginResponse(result) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;

            if (result.success) {
                showMessage(`✓ 歡迎 ${result.name} 登入`, 'success');
                
                // 儲存登入資訊至 sessionStorage
                sessionStorage.setItem('admin_account', result.account);
                sessionStorage.setItem('admin_name', result.name);
                sessionStorage.setItem('admin_position', result.position);

                // 3秒後重導向至後台主控面板
                setTimeout(() => {
                    window.location.href = '?page=admin_dashboard';
                }, 1500);
            } else {
                showMessage(`❌ ${result.message}`, 'error');
            }
        }

        function handleLoginError(error) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('loginBtn').disabled = false;
            showMessage('❌ 連接失敗，請檢查網路或稍後再試', 'error');
            console.error('登入錯誤:', error);
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = 'message ' + type;
        }

        // 頁面載入時檢查是否已登入
        window.addEventListener('load', () => {
            const adminAccount = sessionStorage.getItem('admin_account');
            if (adminAccount) {
                // 已登入，重導向至主控面板
                window.location.href = '?page=admin_dashboard';
            }
        });
    </script>
</body>
</html>
