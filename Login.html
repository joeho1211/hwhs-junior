<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申請入學審查資料系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-container { background: white; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); padding: 40px; width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        .btn-login { width: 100%; padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-login:hover { background: #5568d3; }
        .links { display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px; }
        .links a { color: #667eea; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .message { padding: 12px; margin-bottom: 20px; border-radius: 5px; display: none; }
        .message.error { background: #fee; color: #c33; display: block; }
        .message.success { background: #efe; color: #3c3; display: block; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="header">
            <h1>申請入學審查資料系統</h1>
            <p>學生登入</p>
        </div>
        <div id="message" class="message"></div>
        <form id="loginForm">
            <div class="form-group">
                <label for="account">參加證號</label>
                <input type="text" id="account" name="account" required placeholder="請輸入參加證號">
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" name="password" required placeholder="身分證10碼+生日月日">
            </div>
            <button type="submit" class="btn-login">登入</button>
        </form>
        <div class="links">
            <a href="#" onclick="showForgotPassword()">忘記密碼？</a>
            <a href="#" onclick="showHelp()">需要幫助？</a>
        </div>
    </div>

    <!-- 忘記密碼Modal -->
    <div id="forgotModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px;">
            <h3>重設密碼</h3>
            <p style="margin: 15px 0; color: #666; font-size: 14px;">請輸入您的參加證號與身分證字號</p>
            <div class="form-group">
                <label>參加證號</label>
                <input type="text" id="forgotAccount" placeholder="參加證號">
            </div>
            <div class="form-group">
                <label>身分證字號</label>
                <input type="text" id="forgotID" placeholder="身分證字號">
            </div>
            <button style="width: 100%; padding: 10px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;" onclick="sendResetEmail()">寄送重設連結</button>
            <button style="width: 100%; padding: 10px; margin-top: 10px; background: #ddd; border: none; border-radius: 5px; cursor: pointer;" onclick="closeForgotPassword()">取消</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const account = document.getElementById('account').value;
            const password = document.getElementById('password').value;
            
            try {
                const result = await google.script.run.withSuccessHandler(handleLoginResponse).validateLogin(account, password);
            } catch (error) {
                showMessage('系統錯誤，請稍後再試', 'error');
            }
        });

        function handleLoginResponse(result) {
            if (result.success) {
                sessionStorage.setItem('account', result.account);
                window.location.href = 'https://script.google.com/macros/d/AKfycbzkLGOykrCdNRhjB1OiwzruOarnMNOXKl79OcBdlqlfnQYlEXvDS05WDuZJhZt0gFeVpQ/usercallback?page=basicInfo';
            } else {
                showMessage(result.message, 'error');
            }
        }

        function showMessage(msg, type) {
            const msgDiv = document.getElementById('message');
            msgDiv.textContent = msg;
            msgDiv.className = 'message ' + type;
        }

        function showForgotPassword() {
            document.getElementById('forgotModal').style.display = 'flex';
        }

        function closeForgotPassword() {
            document.getElementById('forgotModal').style.display = 'none';
        }

        function sendResetEmail() {
            const account = document.getElementById('forgotAccount').value;
            const idNumber = document.getElementById('forgotID').value;
            
            if (!account || !idNumber) {
                alert('請輸入完整資訊');
                return;
            }

            google.script.run.withSuccessHandler((result) => {
                alert(result.message);
                if (result.success) {
                    closeForgotPassword();
                }
            }).sendPasswordResetEmail(account, idNumber);
        }

        function showHelp() {
            alert('密碼為身分證10碼（含英文字母大寫）+ 生日月日4碼\n例：A123456789 + 0515 = A1234567890515');
        }
    </script>
</body>
</html>
